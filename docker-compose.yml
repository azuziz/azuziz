# Local stack: `docker compose up --build`, then open http://localhost:3000.
# Put provider keys in apps/api/.env (copy apps/api/.env.example). Without keys it runs in demo mode.
services:
  api:
    build: ./apps/api
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - api-data:/data

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  api-data:
