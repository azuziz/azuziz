# STT and LLM providers. Keys are read from the environment variable named in `api_key_env`; never put keys here.
#
# Prices are USD per million tokens, from public listings checked 2026-10-06. Verify them on each provider's console
# before quoting. Base URLs and model IDs for brand-new models also need a check: list models with GET {base_url}/models.
#
# structured_output:
#   "json_schema"  strict JSON schema (falls back to json_object automatically if the provider rejects it)
#   "json_object"  JSON mode; we validate against our schema and retry once with the error
#
# params: extra keyword arguments passed to chat.completions.create (e.g. reasoning_effort, max_completion_tokens).

# ---------------------------------------------------------------- LLMs: direct provider APIs

[llm."gpt-6-luna"]
label = "GPT-6 Luna (OpenAI)"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
model = "gpt-6-luna"
structured_output = "json_schema"
price_input = 0.10
price_cached_input = 0.01
price_output = 0.50

[llm."mimo-v2.6-pro"]
label = "MiMo-V2.6-Pro (Xiaomi)"
base_url = "https://api.xiaomimimo.com/v1"
api_key_env = "MIMO_API_KEY"
model = "mimo-v2.6-pro"
structured_output = "json_object"  # MiMo has JSON mode but no json_schema
price_input = 0.43
price_cached_input = 0.0036
price_output = 0.87

[llm."kimi-k2.6"]
label = "Kimi K2.6 (Moonshot)"
base_url = "https://api.moonshot.ai/v1"  # China-mainland keys use https://api.moonshot.cn/v1
api_key_env = "MOONSHOT_API_KEY"
model = "kimi-k2.6"
structured_output = "json_schema"
price_input = 0.95
price_cached_input = 0.16
price_output = 4.00

[llm."kimi-k3"]
label = "Kimi K3 (Moonshot)"
base_url = "https://api.moonshot.ai/v1"
api_key_env = "MOONSHOT_API_KEY"
model = "kimi-k3"
structured_output = "json_schema"
price_input = 3.00
price_cached_input = 0.30
price_output = 15.00

