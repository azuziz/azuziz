# ---------------------------------------------------------------- Speech-to-text

[stt.elevenlabs]
label = "ElevenLabs Scribe v2"
provider = "elevenlabs"
base_url = "https://api.elevenlabs.io/v1"
api_key_env = "ELEVENLABS_API_KEY"
model = "scribe_v2"
# Set from your ElevenLabs plan (USD per audio minute); left empty so reports show "n/a" instead of a guess.
# price_per_minute = 0.0

[stt.openai]
label = "OpenAI transcription"
